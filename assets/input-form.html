<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>公考岗位匹配 · 输入档案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#1b2738;font:15px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}p{color:#526176}.card{background:white;border:1px solid #dbe1e8;border-radius:12px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}label{display:block;font-size:13px;color:#46566c}input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid #bdc9d7;border-radius:7px;background:white;color:#172b43}button{font:inherit;padding:9px 16px;border:1px solid #c5d0df;border-radius:7px;background:white;color:#244464;cursor:pointer}.primary{background:#174d80;color:white;border-color:#174d80}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.major{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;padding:12px 0;border-bottom:1px solid #edf0f5}.provinces{display:flex;gap:6px;flex-wrap:wrap}.provinces label{padding:4px 8px;border:1px solid #dce2eb;border-radius:5px}.provinces input{width:auto}.hint{font-size:13px;color:#64758a}details{margin-top:16px}pre{max-height:360px;overflow:auto;background:#f0f3f7;padding:16px;border-radius:8px}#message{white-space:pre-wrap;color:#9b3b21}.remove{color:#a03838}input[type=checkbox]{width:auto}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #90bbe5;outline-offset:2px}@media(max-width:680px){.grid,.major{grid-template-columns:1fr}main{padding:22px 16px}}
</style>
<main><h1>公考岗位匹配</h1><p>填写学历、专业与省份，生成输入档案。将档案交给技能后，由技能获取官方资料并匹配岗位。</p>
<section class="card"><h2>目标地区与招录范围</h2><div id="provinces" class="provinces"></div><div class="grid" style="margin-top:16px"><label>招录年度<input id="year" inputmode="numeric" placeholder="不填：逐省查询最新已发布年度"></label><label>批次<select id="batch"><option value="regular">常规公开招录</option><option value="supplementary">补充录用</option></select></label><label>出生日期（可后补）<input id="birth" type="date"></label></div></section>
<div id="educations"></div><div class="actions"><button id="addEducation" type="button">＋ 添加学历—专业</button><label><input type="checkbox" id="complete"> 已填写全部学历和专业</label></div>
<section class="card"><div class="actions"><button class="primary" id="generate">生成匹配输入</button><button id="download">下载档案JSON</button><button id="copy">复制档案</button></div><p id="message" role="status" aria-live="polite"></p><p class="hint">此表单离线运行，不上传或永久保存资料。未知字段会保留为待确认；不同毕业证或培养方式请分开添加学历。</p><pre id="preview" aria-label="档案预览">尚未生成档案。</pre></section>
</main>
<template id="educationTemplate"><section class="card education"><div class="actions" style="justify-content:space-between"><h2>学历记录</h2><button class="deleteEducation remove" type="button">删除学历</button></div><div class="grid"><label>学历层次<select class="level"><option value="junior_college">专科</option><option value="bachelor">本科</option><option value="master">硕士研究生</option><option value="doctorate">博士研究生</option><option value="other">其他</option></select></label><label>培养方式<select class="form"><option value="unknown">待确认</option><option value="full_time">全日制</option><option value="self_taught">自考</option><option value="part_time">非全日制</option><option value="adult">成人教育</option><option value="open">开放教育</option><option value="distance">网络教育</option><option value="other">其他</option></select></label><label>毕业证状态<select class="graduation"><option value="unknown">待确认</option><option value="obtained">已取得</option><option value="pending">预计取得</option><option value="not_obtained">未取得</option></select></label></div><div class="majors"></div><button class="addMajor" type="button" style="margin-top:12px">＋ 添加专业</button><details><summary>补充毕业日期与资格信息</summary><div class="grid"><label>毕业证取得日期<input class="graduationDate" type="date"></label><label>预计毕业日期<input class="expectedDate" type="date"></label><label>国家承认学历<select class="recognition"><option value="unknown">待确认</option><option value="self_declared">本人确认是</option><option value="rejected">明确不符合</option></select></label></div></details></section></template>
<template id="majorTemplate"><div class="major"><label>专业正式名称<input class="name" placeholder="填写证书或学籍上的专业名称"></label><label>专业性质<select class="role"><option value="unknown">待确认</option><option value="primary">主修</option><option value="minor">辅修</option><option value="second_degree">第二学士学位</option><option value="dual_degree">双学位第二专业</option></select></label><label>对应学位状态<select class="degreeStatus"><option value="unknown">待确认</option><option value="obtained">已取得</option><option value="pending">预计取得</option><option value="not_obtained">未取得</option><option value="not_applicable">无对应学位</option></select></label><button class="deleteMajor remove" type="button">删除专业</button><label>对应学位层次<select class="degreeLevel"><option value="">待确认／无</option><option value="bachelor">学士</option><option value="master">硕士</option><option value="doctorate">博士</option></select></label><label>学位取得日期<input class="degreeDate" type="date"></label><label>专业证书依据<select class="credential"><option value="unknown">待确认</option><option value="self_declared">本人确认有相应证书</option><option value="rejected">明确无相应证书</option></select></label></div></template>
<script>
const provinces='北京 天津 河北 山西 内蒙古 辽宁 吉林 黑龙江 上海 江苏 浙江 安徽 福建 江西 山东 河南 湖北 湖南 广东 广西 海南 重庆 四川 贵州 云南 西藏 陕西 甘肃 青海 宁夏 新疆'.split(' ');
for(const name of provinces){const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.value=name;label.append(box,document.createTextNode(' '+name));document.getElementById('provinces').append(label)}
let counter=0,majorCounter=0;
function addMajor(section){const el=document.getElementById('majorTemplate').content.firstElementChild.cloneNode(true);el.dataset.id='major-'+(++majorCounter);el.querySelector('.deleteMajor').onclick=()=>{el.remove()};section.querySelector('.majors').append(el)}
function addEducation(){const el=document.getElementById('educationTemplate').content.firstElementChild.cloneNode(true);el.dataset.id='edu-'+(++counter);el.querySelector('h2').textContent='学历记录 '+counter;el.querySelector('.deleteEducation').onclick=()=>el.remove();el.querySelector('.addMajor').onclick=()=>addMajor(el);document.getElementById('educations').append(el);addMajor(el)}
document.getElementById('addEducation').onclick=addEducation;addEducation();
function value(el,selector){return el.querySelector(selector).value.trim()}
function generate(){const chosen=[...document.querySelectorAll('#provinces input:checked')].map(x=>x.value);if(!chosen.length)throw Error('请选择至少一个省份。');const year=document.getElementById('year').value.trim();if(year&&!/^20\d{2}$/.test(year))throw Error('年份请填写四位数字，或留空。');const complete=document.getElementById('complete').checked;const educations=[...document.querySelectorAll('.education')].map(el=>{const form=value(el,'.form'),level=value(el,'.level');const majors=[...el.querySelectorAll('.major')].map(m=>{const name=value(m,'.name');if(!name)throw Error('请填写每个专业的正式名称，或删除空专业行。');return{id:m.dataset.id,name_on_certificate:name,name_hint:name,code:null,role:value(m,'.role'),credential_status:value(m,'.credential'),degree:{status:value(m,'.degreeStatus'),level:value(m,'.degreeLevel')||null,award_date:value(m,'.degreeDate')||null,expected_award_date:null}}});if(!majors.length)throw Error('每条学历至少填写一个专业。');return{id:el.dataset.id,level,education_form:form==='full_time'?(['master','doctorate'].includes(level)?'graduate_education':'ordinary_higher'):form==='part_time'?(['master','doctorate'].includes(level)?'graduate_education':'other'):form,full_time:form==='full_time'?true:['part_time','self_taught'].includes(form)?false:null,national_unified_admission:null,recognition_status:value(el,'.recognition'),graduation_status:value(el,'.graduation'),graduation_date:value(el,'.graduationDate')||null,expected_graduation_date:value(el,'.expectedDate')||null,majors_complete:complete,majors}});if(!educations.length)throw Error('请添加至少一条学历。');const profile={schema_version:1,profile_id:'local-candidate',target:{provinces:chosen,exam_type:'省考公开招录',recruitment_year:year?Number(year):null,year_strategy:'latest_published_regular',batch:document.getElementById('batch').value,mode:'current_eligibility'},birth_date:document.getElementById('birth').value||null,educations,educations_complete:complete,preferences:{}};const text=JSON.stringify(profile,null,2);document.getElementById('preview').textContent=text;document.getElementById('message').textContent='档案已生成。将JSON交给 $civil-service-job-matcher，技能会继续检索官方资料。';return text}
function act(fn){try{fn()}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('generate').onclick=()=>act(generate);
document.getElementById('download').onclick=()=>act(()=>{const text=generate();const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='公考匹配档案.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('copy').onclick=()=>act(()=>{const text=generate();navigator.clipboard.writeText(text).then(()=>document.getElementById('message').textContent='已复制，可粘贴到技能对话中。').catch(()=>document.getElementById('message').textContent='浏览器未允许剪贴板写入，请下载JSON或从预览中复制。')});
</script></html>
